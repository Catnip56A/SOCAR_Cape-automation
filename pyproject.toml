[project]
name = "socar-cape-mr-ctr"
version = "1.0.0"
description = "MR vs CTR Comparator — SOCAR Cape Commercial Department"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "lxml>=6.1.1",
